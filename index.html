<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1f3a" />
  <title>Examen Civique — Naturalisation</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">NATURALISATION • FRANCE</div>
      <h1>Examen Civique</h1>

    <div class="top-actions">
      <button id="exportBtn" class="ghost small">Exporter</button>

    </div>
  </header>

  <main id="app"></main>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button data-view="today" class="nav-btn active"><span>⌂</span><small>Aujourd’hui</small></button>

    <button data-view="practice" class="nav-btn"><span>✓</span><small>Pratiquer</small></button>
    <button data-view="errors" class="nav-btn"><span>!</span><small>Erreurs</small></button>
    <button data-view="progress" class="nav-btn"><span>↗</span><small>Progrès</small></button>
  </nav>

  <script src="questions.js"></script>
  <script src="app.js"></script>

</html>
