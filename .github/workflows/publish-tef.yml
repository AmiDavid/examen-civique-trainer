name: Publish TEF trainer

on:
  push:
    paths:
      - "tef-irn-trainer-v1.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack TEF app
        run: |
          rm -rf tef .tef-tmp
          mkdir .tef-tmp
          unzip -q -o tef-irn-trainer-v1.zip -d .tef-tmp
          mv .tef-tmp/tef-irn-trainer tef
          rm -rf .tef-tmp
      - name: Commit published app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tef
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish TEF B2 Coach"
            git push
          fi
